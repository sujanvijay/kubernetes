apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy
  labels:
    app: sujan-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sujan-deploy
  template:
    metadata:
      labels:
        app: sujan-deploy
    spec:
      containers:
        - name: nginx-deploy
          image: nginx
          ports:
           - containerPort: 80

